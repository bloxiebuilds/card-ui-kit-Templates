<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    /* =====================
       CONFIG — Edit these!
    ===================== */
    :root {
      --accent: #38BDF8;
      --name: "Jane Doe";
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      width: 100%; max-width: 280px;
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; text-align: center;
    }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: #e0f2fe;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 600; color: var(--accent);
    }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .name { font-size: 1.1rem; font-weight: 600; color: #111; }
    .role { font-size: 0.85rem; color: #888; }
    .bio { font-size: 0.85rem; color: #555; line-height: 1.6; margin-top: 4px; }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    .pill {
      font-size: 0.75rem; padding: 4px 12px;
      border-radius: 999px; border: 1px solid #e5e5e5;
      color: #555; background: #fafafa;
      text-decoration: none; transition: all 0.2s;
    }
    .pill:hover { border-color: var(--accent); color: var(--accent); }
    .btn {
      margin-top: 4px; width: 100%; padding: 0.65rem;
      background: var(--accent); color: #fff; border: none;
      border-radius: 999px; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar" id="avatar">JD</div>
    <div>
      <p class="name">Jane Doe</p>
      <p class="role">Product Designer · San Francisco</p>
    </div>
    <p class="bio">Building beautiful digital experiences. Open to freelance work.</p>
    <div class="pills">
      <a href="#" class="pill">Twitter</a>
      <a href="#" class="pill">GitHub</a>
      <a href="#" class="pill">LinkedIn</a>
    </div>
    <button class="btn">Follow</button>
  </div>
</body>
</html>
