<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pricing Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem; gap: 16px; flex-wrap: wrap;
    }
    .card {
      background: #fff; border: 1px solid #e5e5e5;
      border-radius: 20px; padding: 1.75rem;
      width: 100%; max-width: 220px;
    }
    .card.featured { border: 2px solid #38BDF8; }
    .badge {
      display: inline-block; font-size: 0.7rem; font-weight: 600;
      padding: 3px 10px; border-radius: 999px;
      background: #e0f2fe; color: #0369a1; margin-bottom: 12px;
    }
    .plan { font-size: 1rem; font-weight: 600; color: #111; margin-bottom: 6px; }
    .price { font-size: 2rem; font-weight: 600; color: #111; margin-bottom: 16px; }
    .price span { font-size: 0.85rem; font-weight: 400; color: #888; }
    .features { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
    .features li { font-size: 0.85rem; color: #555; }
    .features li::before { content: "✓  "; color: #22c55e; font-weight: 600; }
    .btn {
      width: 100%; padding: 0.65rem; border-radius: 999px;
      font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .btn-outline { background: transparent; border: 1px solid #e5e5e5; color: #111; }
    .btn-outline:hover { border-color: #38BDF8; color: #38BDF8; }
    .btn-filled { background: #38BDF8; border: none; color: #fff; }
    .btn-filled:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <!-- Free -->
  <div class="card">
    <p class="plan">Free</p>
    <p class="price">$0<span>/mo</span></p>
    <ul class="features">
      <li>3 projects</li>
      <li>Basic support</li>
      <li>1GB storage</li>
    </ul>
    <button class="btn btn-outline">Get started</button>
  </div>

  <!-- Pro (featured) -->
  <div class="card featured">
    <span class="badge">Most popular</span>
    <p class="plan">Pro</p>
    <p class="price">$12<span>/mo</span></p>
    <ul class="features">
      <li>Unlimited projects</li>
      <li>Priority support</li>
      <li>50GB storage</li>
      <li>Custom domain</li>
    </ul>
    <button class="btn btn-filled">Get started</button>
  </div>

  <!-- Enterprise -->
  <div class="card">
    <p class="plan">Enterprise</p>
    <p class="price">$49<span>/mo</span></p>
    <ul class="features">
      <li>Everything in Pro</li>
      <li>Dedicated support</li>
      <li>Unlimited storage</li>
      <li>SLA guarantee</li>
    </ul>
    <button class="btn btn-outline">Contact us</button>
  </div>
</body>
</html>
